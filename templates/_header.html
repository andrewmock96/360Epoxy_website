<div class="top-banner">
    <div class="banner-left">
        <div class="social-icons">
            <a href="https://www.facebook.com/profile.php?id=61576135785952#" target="_blank" rel="noopener noreferrer" class="social-icon fb" aria-label="Facebook">
                <img src="{{ url_for('static', filename='images/icons/facebook.webp') }}" alt="">
            </a>
            <a href="https://www.instagram.com/360epoxy" target="_blank" rel="noopener noreferrer" class="social-icon ig" aria-label="Instagram">
                <img src="{{ url_for('static', filename='images/icons/instagram.webp') }}" alt="">
            </a>
        </div>
    </div>

    <div class="banner-right">
        {% if request.path != '/contact' %}
            <a href="/contact" class="banner-btn">Free Quote</a>
        {% endif %}
        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </div>

    <nav class="nav-links mobile-nav">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/services" class="nav-link {% if request.path == '/services' %}active{% endif %}">Services</a>
        <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">Gallery</a>
        <a href="/contact" class="nav-link {% if request.path == '/contact' %}active{% endif %}">Contact Us</a>
    </nav>
</div>

<header>
    <div class="header-container">
        <div class="header-brand">
            <a href="/"><img src="{{ url_for('static', filename='images/logo/360Epoxy_logo.webp') }}" alt="360Epoxy Logo" class="logo"></a>
            <p class="header-tagline">Premium Floor Coatings<br>Salt Lake City Area</p>
        </div>
        <nav class="nav-links desktop-nav">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/services" class="nav-link {% if request.path == '/services' %}active{% endif %}">Services</a>
            <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">Gallery</a>
            <a href="/contact" class="nav-link {% if request.path == '/contact' %}active{% endif %}">Contact Us</a>
        </nav>
    </div>
</header>

<script src="{{ url_for('static', filename='js/site-nav.js') }}" defer></script>
