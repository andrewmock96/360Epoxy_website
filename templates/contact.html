<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | 360Epoxy</title>
    <meta name="description" content="Contact 360Epoxy for a free quote on garage floor coatings and epoxy flooring services in Salt Lake City.">
    
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='googletabicon-32px.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='googlesearchicon-48px.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='googlesearchicon-48px.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='googlesearchicon-48px.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
    <body>
        <!-- TOP BANNER BAR -->
        <div class="top-banner">
            <div class="banner-left">
                <div class="social-icons">
                    <a href="https://www.facebook.com/profile.php?id=61576135785952#" target="_blank" class="social-icon fb">
                        <img src="{{ url_for('static', filename='icons/facebook.png') }}" alt="Facebook">
                    </a>
                    <a href="https://www.instagram.com/360epoxy" target="_blank" class="social-icon ig">
                        <img src="{{ url_for('static', filename='icons/instagram.png') }}" alt="Instagram">
                    </a>
                </div>
            </div>

            <div class="banner-right">
                <a href="https://360epoxy.org/lead-generation"
                class="banner-btn"
                target="_blank"
                rel="noopener noreferrer">
                    Get Free Quote
                </a>

                <!-- Hamburger icon -->
                <button class="menu-toggle" aria-label="Toggle menu">
                    ☰
                </button>
            </div>

            <!-- Navigation links Mobile -->
            <nav class="nav-links mobile-nav">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                <a href="/services" class="nav-link {% if request.path == '/services' %}active{% endif %}">Services</a>
                <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">Gallery</a>
            </nav>
        </div>

        <header>
            <div class="header-container">
                <img src="{{ url_for('static', filename='logo/360Epoxy_logo.png') }}" alt="360 Epoxy Logo" class="logo">

                <!-- Navigation links Desktop -->
                <nav class="nav-links desktop-nav">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                    <a href="/services" class="nav-link {% if request.path == '/services' %}active{% endif %}">Services</a>
                    <a href="/gallery" class="nav-link {% if request.path == '/gallery' %}active{% endif %}">Gallery</a>
                    <a href="https://360epoxy.org/lead-generation"
                       class="banner-btn"
                       target="_blank"
                       rel="noopener noreferrer">
                        Get Free Quote
                    </a>
                </nav>
            </div>
        </header>

        

        <footer>
            <!-- Social icons at the top -->
            <div class="footer-socials">
                <a href="https://www.facebook.com/360epoxy" target="_blank">
                    <img src="{{ url_for('static', filename='icons/facebook.png') }}" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/360epoxy" target="_blank">
                    <img src="{{ url_for('static', filename='icons/instagram.png') }}" alt="Instagram">
                </a>
            </div>

            <!-- Divider line -->
            <div class="footer-divider"></div>

            <!-- Contact info stacked -->
            <div class="footer-contact">
                <a href="tel:+13855583495">Phone: (385)-558-3495</a>
                <a href="mailto:360epoxyaz@gmail.com">Email: 360epoxyaz@gmail.com</a>
            </div>

            <!-- Copyright -->
            <p>&copy; 2025 360Epoxy. All rights reserved.</p>
        </footer>

        <!-- Hamburger Menu Script -->
        <script>
            const menuToggle = document.querySelector('.menu-toggle');
            const mobileNav = document.querySelector('.mobile-nav');
            const mobileLinks = document.querySelectorAll('.mobile-nav a');
            const allNavLinks = document.querySelectorAll('.nav-links a');

            if (menuToggle && mobileNav) {
                menuToggle.addEventListener('click', () => {
                    mobileNav.classList.toggle('active');
                });
            }

            const currentPath = window.location.pathname;

            allNavLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });

            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                });
            });

            /* ==============================
                Section Scroll Animation
            ============================== */
            // Scroll animation for any elements with .animate-on-scroll
            const scrollItems = document.querySelectorAll('.animate-on-scroll');

            const scrollObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target); // animate only once
                    }
                });
            }, { threshold: 0.2 });

            scrollItems.forEach(item => {
                scrollObserver.observe(item);
            });

            /* ==============================
                        ZOOM MODAL
            ============================== */
            const zoomModal = document.getElementById("zoom-modal");
            const zoomImg = document.getElementById("zoom-image");

            if (zoomModal && zoomImg) {
                document.querySelectorAll(".flake-card img").forEach(img => {
                    img.addEventListener("click", () => {
                        zoomImg.src = img.src;
                        zoomModal.style.display = "flex";

                        requestAnimationFrame(() => {
                            zoomModal.classList.add("show");
                        });
                    });
                });

                zoomModal.addEventListener("click", () => {
                    zoomModal.classList.remove("show");
                    setTimeout(() => {
                        zoomModal.style.display = "none";
                    }, 300);
                });
            }
        </script>
    </body>
</html>
